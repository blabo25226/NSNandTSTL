# TSTL Phase R1 — Colab (T4 16GB) defaults
model_name: Qwen/Qwen2.5-0.5B-Instruct
dataset: openai/gsm8k
train_subset: 256
eval_subset: 64
num_layers_scan: null  # null = all transformer blocks
grpo:
  learning_rate: 1.0e-5
  num_train_steps: 200
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  max_prompt_length: 256
  max_completion_length: 128
  seed: 42
output:
  drive_mount: true
  checkpoint_root: /content/drive/MyDrive/TSTL/r1
